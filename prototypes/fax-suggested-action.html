<style>
/* Layout: control bar, then a full-width intake app frame (fax viewer + right rail), then per-scenario design notes. */
:root {
  --bg: #F2F3F6;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --fg: #1E2330;
  --muted: #687082;
  --line: #DCDFE6;
  --brand: #00A9D1;
  --brand-fg: #FFFFFF;
  --link: #039EC3;
  --ds-text: #212936;
  --ds-text-2: #5E6572;
  --ds-text-3: #6F7580;
  --ds-divider: #E5E5E5;
  --ds-field-line: #DADFE8;
  --ds-card-shadow: 0 2px 2px 0 rgba(207, 226, 231, 0.8);
  --ds-chip-neutral: #F5F5F5;
  --ds-pend-bg: #FFF5E5;
  --ds-pend-fg: #9E6300;
  --ds-ok-bg: #ECF9F3;
  --ds-ok-fg: #04A15F;
  --ds-banner-bg: #F1F0FA;
  --ds-banner-fg: #55358F;
  --ds-disabled: #D7D5D5;
  --ds-error: #C62828;
  --ai-bg: #F0EEFB;
  --ai-line: #DCD7F7;
  --ai-fg: #2C2F7C;
  --ai-icon: #8B7CF0;
  --grad-a: #7BD9F9;
  --grad-b: #A78DFF;
  --warn-bg: #FFF4DE;
  --warn-fg: #7F4D00;
  --ok-bg: #E4F4E9;
  --ok-fg: #1D6E39;
  --pend-bg: #FFF2CF;
  --pend-fg: #865B00;
  --danger: #C8372D;
  --scrim: rgba(20, 22, 30, .45);
  --code-bg: #F4F5F8;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1360px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 64px; display: grid; gap: 20px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* control bar */
.controls { display: grid; gap: 14px; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.title-row h1 { font-size: 22px; font-weight: 700; }
.title-row p { margin: 0; color: var(--muted); }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.ctrl-label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-right: 8px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip small { opacity: .7; font-family: var(--font-mono); font-size: 11px; margin-left: 4px; }

/* app frame */
.app { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 608px; height: 1024px; max-height: 1024px; }
.viewer { background: var(--surface-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.toolbar { background: #fff; line-height: 0; border-bottom: 1px solid var(--ds-divider); }
.toolbar img { width: 100%; height: auto; display: block; }
.paper-scroll { overflow: auto; padding: 0 20px 20px; flex: 1; background: #fff; }
.faxform { display: block; width: 100%; max-width: 796px; height: auto; margin: 8px auto 0; }

.railwrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; max-height: 1024px; background: #fff; overflow: hidden; }
.rail { overflow: auto; padding: 32px 24px 24px; display: flex; flex-direction: column; gap: 24px; min-width: 0; flex: 1 1 0; min-height: 0; color: var(--ds-text); font-size: 15px; line-height: 1.2; }
.railfoot { flex: none; height: 76px; box-sizing: border-box; padding: 14px 24px; background: #fff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 4px rgba(0,0,0,.14), 0 4px 5px rgba(0,0,0,.12), 0 1px 10px rgba(0,0,0,.2); clip-path: inset(-20px 0 0 0); align-items: center; }
.railfoot .lnk.cancel { color: var(--ds-error); font-weight: 600; font-size: 15px; }
.railfoot .btn { min-height: 48px; }
.file-row { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 18px; line-height: 20px; height: 20px; flex: none; }
.meta { display: flex; justify-content: space-between; gap: 16px; height: 36px; margin-top: 8px; flex: none; }
.meta div { min-width: 0; }
.meta .k { font-size: 13px; line-height: 15px; color: var(--ds-text-2); margin-bottom: 3px; white-space: nowrap; }
.meta .v { font-size: 15px; line-height: 18px; font-weight: 400; font-variant-numeric: tabular-nums; white-space: nowrap; }
hr.div { border: 0; border-top: 1px solid var(--ds-divider); margin: 8px 0 0; flex: none; width: 100%; }
.h-sec { font-size: 20px; line-height: 25px; height: 25px; font-weight: 600; }
.lookup { display: flex; flex-direction: column; gap: 32px; flex: none; margin-top: -2px; }
.lookup .other { gap: 8px; margin-top: -1px; }

/* AI recommendation banner: spec = Figma "Status Banner" frame (16/8 padding, 8 gap) */
.rec { background: var(--ds-banner-bg); border-radius: 4px; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 19px; flex: none; margin-top: 7px; margin-bottom: 10px; }
.rec .row1 { display: flex; align-items: center; gap: 16px; min-height: 59px; }
.rec .spark { flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--ai-icon); }
.rec .spark svg { width: 24px; height: 24px; }
.rec .copy { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rec .t { color: var(--ds-banner-fg); font-weight: 600; }
.rec .b { color: #48505C; font-weight: 400; }
.rec .b strong { color: var(--link); font-weight: 600; }
.rec .more { flex: none; min-height: 0; height: 20px; line-height: 20px; font-size: 16px; padding: 0; align-self: center; }
.rec .divider { border: 0; border-top: 2px solid var(--ds-field-line); margin: 0; flex: none; }
.rec .detail { display: flex; padding: 0 0 0 40px; font-size: 14px; line-height: 17px; color: #48505C; min-height: 40px; align-items: center; }
.rec .row1 + .divider { margin-top: -1px; }
.rec .divider + .detail { margin-bottom: -1px; }
.lnk { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; font-weight: 600; font-size: 15px; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; min-height: 32px; }
.lnk:hover { text-decoration: underline; }
.lnk.muted { color: var(--ds-text-2); font-weight: 500; }
.callout { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; }
.callout .ct { font-weight: 700; }
.callout code { font-family: var(--font-mono); font-size: 12.5px; }
.fb { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.fb .chip { font-size: 13px; padding: 4px 10px; }

/* fields */
.fields { display: grid; gap: 16px; }
.field { border: 1px solid var(--ds-field-line); border-radius: 4px; padding: 8px 16px; min-height: 56px; background: #fff; position: relative; }
.field label { display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 15px; color: var(--ds-text-3); }
.field input { border: 0; outline: 0; background: transparent; width: 100%; font: inherit; font-size: 16px; color: var(--ds-text); padding: 4px 0 0; font-variant-numeric: tabular-nums; }
.field:focus-within { border-color: var(--brand); }
.field .ai { color: var(--ai-icon); display: none; }
.field.has-ai .ai { display: inline-flex; }
.field.err { border-color: var(--danger); }
.btn { background: var(--brand); color: var(--brand-fg); border: 0; border-radius: 4px; padding: 12px 24px; min-height: 48px; font-family: inherit; font-weight: 600; cursor: pointer; font-size: 16px; }
.btn:disabled { background: var(--ds-disabled); color: rgba(255,255,255,.6); cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.sm { padding: 6px 14px; min-height: 36px; font-size: 15px; }
.btn.ghost { background: transparent; color: var(--link); border: 1px solid var(--link); }
.other { display: grid; gap: 8px; font-size: 16px; font-weight: 600; }
.other .row { display: flex; flex-wrap: wrap; gap: 6px 0; }
.other .row .lnk { padding: 0 14px; border-right: 1px solid var(--ds-divider); font-weight: 600; }
.other .row .lnk:first-child { padding-left: 0; }
.other .row .lnk:last-child { border-right: 0; }
.hint { color: var(--danger); font-size: 13px; }

/* results */
.searched { margin-top: 7px; background: rgba(0,0,0,.04); border: 1px solid var(--ds-divider); border-radius: 4px; padding: 10px 16px; height: 56px; flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 15px; color: var(--ds-text); }
.searched .k { font-size: 13px; line-height: 15px; color: var(--ds-text-3); }
.searched strong { font-weight: 400; }
.searched .lnk { color: var(--ds-text-2); font-weight: 500; }
.patient { display: grid; gap: 8px; height: 50px; align-content: start; flex: none; }
.patient .nm { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; line-height: 24px; height: 24px; }
.patient .nm .lnk { min-height: 24px; }
.patient .row { display: flex; gap: 4px 32px; font-size: 15px; line-height: 18px; height: 18px; }
.patient .row span.k { color: var(--ds-text-3); font-size: 13px; margin-right: 8px; }
.cards { display: flex; flex-direction: column; gap: 12px; flex: none; }
.cards > * { flex: none; }
.card { border: 1px solid var(--ds-divider); border-radius: 4px; padding: 16px; display: grid; gap: 16px; align-content: start; flex: none; box-sizing: border-box; height: 237px; box-shadow: var(--ds-card-shadow); background: #fff; }

.card.recd { border: 1px solid transparent; background: linear-gradient(#fff, #fff) padding-box, linear-gradient(180deg, var(--grad-a), var(--grad-b)) border-box; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; height: 20px; }
.card .top .lnk { min-height: 20px; }
.card .svc { font-weight: 600; font-size: 16px; line-height: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.lnk .ico, .lnk .ai-icon svg { width: 24px; height: 24px; flex: none; }
.lnk .ai-icon { color: var(--ai-icon); display: inline-flex; }
.sub { display: flex; gap: 10px; font-size: 13px; line-height: 15px; height: 23px; align-items: center; }
.card .hdr { display: grid; gap: 8px; height: 51px; }
.pill { padding: 4px; border-radius: 4px; background: var(--ds-chip-neutral); color: var(--ds-text-2); line-height: 15px; }
.pill.pend { background: var(--ds-pend-bg); color: var(--ds-pend-fg); }
.pill.ok { background: var(--ds-ok-bg); color: var(--ds-ok-fg); }
.kv { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 48px; font-size: 15px; line-height: 18px; height: 37px; }
.kv .k, .dx .k { color: var(--ds-text-2); font-size: 13px; line-height: 15px; margin-bottom: 4px; font-weight: 400; }
.kv .v { font-weight: 500; font-variant-numeric: tabular-nums; }
.dx .v { font-weight: 500; }
.dx { font-size: 15px; font-weight: 500; line-height: 18px; height: 37px; }
.cacts { display: flex; gap: 8px 46px; align-items: center; justify-content: space-between; height: 32px; }
.new-auth { display: flex; align-items: center; gap: 10px; height: 32px; flex: none; }
.new-auth .lnk { padding-left: 8px; }
.empty { border: 1px dashed var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 6px; }
.empty .t { font-weight: 600; }

/* done */
.done { display: grid; gap: 12px; place-content: center; text-align: center; height: 100%; padding: 30px; }
.done .big { font-size: 22px; font-weight: 700; }
.done .note { color: var(--muted); max-width: 46ch; margin: 0 auto; }
.done .match { display: inline-flex; gap: 6px; align-items: center; justify-self: center; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
.match.yes { background: var(--ok-bg); color: var(--ok-fg); }
.match.no { background: var(--warn-bg); color: var(--warn-fg); }

/* review view: fax vs request */
.rv-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cmp { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.cmp .r { display: grid; grid-template-columns: 110px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 14px; align-items: start; }
.cmp .r:first-child { border-top: 0; }
.cmp .r.hd { background: var(--surface-2); color: var(--muted); font-size: 12.5px; font-weight: 600; }
.cmp .lbl { color: var(--muted); }
.cmp .val { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.cmp .st { display: block; font-size: 12.5px; font-weight: 600; margin-top: 2px; }
.cmp .st.ok { color: var(--ok-fg); }
.cmp .st.warn { color: var(--warn-fg); }
.rv-acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.rv-note { color: var(--muted); font-size: 13px; }

/* notes */
.notes { display: grid; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.panel h2 { font-size: 17px; }
.panel h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.panel p, .panel li { max-width: 68ch; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.panel p { margin: 0; }
pre.payload { background: var(--code-bg); border-radius: 6px; padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; margin: 0; line-height: 1.5; }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .railwrap { min-height: 640px; }
  .viewer { order: 2; border-right: 0; border-top: 1px solid var(--line); max-height: 520px; }
  .rail { overflow: visible; }
}
@media (max-width: 520px) {
  .cmp .r { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cmp .r .lbl { grid-column: 1 / -1; }
  .meta, .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wrap { padding-inline: 16px; }
  .rail { padding: 18px 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .rec, .card.recd { animation: rise .22s ease-out both; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
</head>

      sees: ['Copy tells the user what to do ("start a continuation"), not "attach". The current frame borrows the attach wording.', 'The referenced request is the approved one. A tracking-ID search returns only INVY9816, with a gradient outline and a sparkle on "Start continuation". The banner stays above the results.'],
      qs: ['The model returns both a reference SR ID and an auth number. Which one do we prefill? Tracking number matches what intake searches by today.', 'What happens when the approved request expired long ago? Should a continuation still be recommended, or a new SR?'],
      future: ['"Review request" shows the fax dates start the day after the approved request ends, and flags that the CPT codes differ (97113, 97115 vs 97110, 97140). That is what a reviewer needs to see before agreeing.'],
    },
  },
  new: {
    label: 'New SR', code: 'NEW_SR',
    decision: { value: 'NEW_SR', confidence: 0.91, ref: null, refAuth: null },
    title: 'New authorization recommended',
    body: 'No open request matches this fax.',
    why: 'No open request for this member covers 05/25/2025 to 06/01/2025. The fax is a completed Part 1 request form with new service details.',
    prefill: { memberId: 'A12345678', dob: '12/13/1989', last: 'Doe' },
    recAction: { card: null, action: 'new' },
    notes: {
      sees: ['Member fields are prefilled (field-level suggestions, which already exist), because a new SR still needs a confirmed member.', 'After search, the banner stays above the results and "Create new authorization" gets a sparkle icon. It stays a link.', 'Existing requests still show, so a user can spot a duplicate the model missed.'],
      qs: ['Here the reasoning claims nothing matches, but the member has a pending PT request (ABCD1234) with overlapping CPTs. Should the UI call out a likely duplicate, or is that the model\'s job?', 'Is the banner useful at all for NEW_SR? It\'s the default path, so the main value may be "you don\'t need to hunt for an existing request."'],
    },
  },
  none: {
    label: 'No recommendation', code: 'null · OTHER · low conf · bad ref',
    decision: null,
    prefill: { memberId: 'A12345678', dob: '12/13/1989', last: 'Doe' },
    recAction: { card: null, action: null },
    callout: {
      title: 'A reference that doesn\'t resolve never reaches the UI',
      body: 'If the agent cites a request that doesn\'t exist for this plan (an OCR misread, a provider typo) or that belongs to a different member, the endpoint returns <code>{ "decision": null }</code>. The user sees today\'s screen, with no "request not found" banner and no dead end.',
      ask: 'The spike\'s FR6 to FR9 cover missing, OTHER, low-confidence and malformed payloads. A well-formed payload that points at nothing isn\'t listed. Add it as a requirement, and decide whether the check lives in the read endpoint or in ML before it posts.',
    },
    notes: {
      sees: ['No decision, OTHER, below threshold, malformed payload, 5xx, and an unresolvable or wrong-member reference all render the same thing: today\'s screen (FR6 to FR9).', 'Field-level sparkles still appear, since they come from the suggested value store, not the agent.', 'Most faxes look like this, so the design has to stay quiet when the agent has nothing.'],
      qs: ['Where does the reference check run, and what does it cost? Resolving an SR ID means a lookup outside the Finding Store.', 'After a split, child attachments have new IDs and no decision. Fine for phase 1, but worth confirming with ML.', 'Log which reason (null / OTHER / threshold / bad reference) caused the empty state, so eval can tell them apart.'],
    },
  },
};
const ORDER = ['attach', 'cont', 'new', 'none'];

const S = { scenario: 'attach', view: 'lookup', future: false, why: false, fb: null, fbOpen: false, fields: {}, ai: {}, err: '', results: null, outcome: null, review: null };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sc = () => SCENARIOS[S.scenario];

function reset() {
  const p = sc().prefill || {};
  S.view = 'lookup'; S.why = false; S.fb = null; S.fbOpen = false; S.err = ''; S.results = null; S.outcome = null; S.review = null;
  S.fields = { auth: p.auth || '', memberId: p.memberId || '', dob: p.dob || '', last: p.last || '' };
  S.ai = { auth: !!p.auth, memberId: !!p.memberId, dob: !!p.dob, last: !!p.last };
  render();
}

function banner() {
  const s = sc();
  if (!s.decision) return '';
  const showReq = S.future && s.decision.ref && S.view === 'lookup' ? `<button class="lnk" data-act="showReq" type="button">Review request</button>` : '';
  const fbLink = S.future ? `<button class="lnk muted" data-act="fbToggle" type="button">Not right?</button>` : '';
  let fb = '';
  if (S.future && S.fbOpen) {
    fb = S.fb ? `<div class="fb" role="status">Thanks. Logged as "${esc(S.fb)}".</div>`
      : `<div class="fb">${['Wrong member', 'Wrong request', 'Should be new', 'Should be attach', 'Other'].map(r => `<button class="chip" data-fb="${r}" type="button">${r}</button>`).join('')}</div>`;
  }
  const detail = S.why ? `<hr class="divider"><div class="detail"><div>${esc(s.why)}</div></div>` : '';
  const extras = (showReq || fbLink) ? `<div class="detail" style="min-height:0;padding-left:40px"><div style="display:flex;gap:16px;flex-wrap:wrap">${showReq}${fbLink}</div></div>${fb ? `<div class="detail" style="min-height:0;padding-left:40px">${fb}</div>` : ''}` : '';
  return `<div class="rec" role="status"><div class="row1"><span class="spark">${SPARK_ICON}</span>
    <div class="copy"><div class="t">${s.title}</div><div class="b">${s.body}</div></div>
    <button class="lnk more" data-act="why" type="button" aria-expanded="${S.why}">${S.why ? 'Less details' : 'More details'}</button></div>
    ${detail}${extras}</div>`;
}

function field(key, label) {
  const ai = S.ai[key] ? ' has-ai' : '';
  const er = S.err && key !== 'auth' && !S.fields[key] && S.err.includes('member') ? ' err' : '';
  return `<div class="field${ai}${er}" data-field="${key}"><label for="f-${key}">${label}<span class="ai" title="Filled from the fax">${SPARK_SM}</span></label><input id="f-${key}" value="${esc(S.fields[key])}" autocomplete="off"></div>`;
}

const META = `<div class="file-row"><span>test_document.pdf</span><span style="color:var(--link)" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></span></div>
  <div class="meta">
    <div><div class="k">Fax from</div><div class="v">(123) 456-7890</div></div>
    <div><div class="k">Added</div><div class="v">09/16/2020, 9:50pm</div></div>
    <div><div class="k">Fax ID</div><div class="v">12345678</div></div>
    <div><div class="k">Case ID</div><div class="v">HMK-1A2B3C4D</div></div>
  </div><hr class="div">`;

function lookupView() {
  return `${META}${banner()}
    <div class="lookup">
    <div class="h-sec">Search by auth or tracking number</div>
    <div class="fields">${field('auth', 'Auth or tracking number')}</div>
    <div class="h-sec">OR search by member info (2 of 3 fields required)</div>
    <div class="fields">${field('memberId', 'Member ID')}${field('dob', 'Member date of birth')}${field('last', 'Member last name')}</div>
    ${S.err ? `<div class="hint" role="alert">${esc(S.err)}</div>` : ''}
    <button class="btn block" data-act="search" type="button">Search</button>
    <div class="other"><div>Other options:</div><div class="row">
      ${['Create fax notice', 'Unable to work', 'Forward fax', 'Split fax'].map(o => `<button class="lnk" data-act="other" data-o="${o}" type="button">${o}</button>`).join('')}
    </div></div></div><hr class="div">`;
}

function card(r, rec) {
  const isRec = rec.card === r.id;
  const statusCls = r.status === 'Pending' ? 'pend' : 'ok';
  const act = (key, label, icon) => {
    const lead = isRec && rec.action === key ? `<span class="ai-icon">${SPARK_ICON}</span>` : icon;
    return `<button class="lnk" data-out="${key}" data-id="${r.id}" type="button">${lead}${label}</button>`;
  };
  return `<div class="card${isRec ? ' recd' : ''}">
    <div class="hdr"><div class="top"><div class="svc">${r.svc}</div><button class="lnk" data-act="details" data-id="${r.id}" type="button">Request details</button></div>
    <div class="sub"><span class="pill">Submitted ${r.submitted}</span><span class="pill ${statusCls}">${r.status}</span></div></div>
    <div class="kv"><div><div class="k">Auth number</div><div class="v">${r.auth}</div></div><div><div class="k">Tracking number</div><div class="v">${r.id}</div></div><div><div class="k">CPT codes</div><div class="v">${r.cpt}</div></div></div>
    <div class="dx"><div class="k">Primary diagnosis code</div>${r.dx}</div>
    <div class="cacts">${act('attach', 'Attach to request', ICON.attach)}${act('cont', 'Start continuation', ICON.cont)}${act('edit', 'Edit request', ICON.edit)}</div>
  </div>`;
}

function resultsView() {
  const s = sc(), r = S.results, rec = s.recAction;
  let body;
  if (r.notFound) {
    body = `<div class="empty"><div class="t">No request found for ${esc(r.q)}</div><div style="color:var(--muted)">Check the number on the fax, or search by member info.</div><div><button class="btn sm ghost" data-act="toMember" type="button">Search by member info</button></div></div>`;
  } else {
    const list = r.by === 'auth' ? REQUESTS.filter(x => x.id === r.match) : [...REQUESTS].sort((a, b) => (b.id === rec.card) - (a.id === rec.card));
    const newRec = rec.action === 'new';
    body = `<div class="patient"><div class="nm"><span>${PATIENT.name}</span><button class="lnk" data-act="details" type="button">${ICON.ext}View patient summary</button></div>
      <div class="row"><span><span class="k">DOB</span>${PATIENT.dob}</span><span><span class="k">Member ID</span>${PATIENT.memberId}</span><span><span class="k">Health plan</span>${PATIENT.plan}</span></div></div>
      <hr class="div" style="margin:0">
      <div class="cards">${list.map(x => card(x, rec)).join('')}
      <div class="new-auth"><button class="lnk" data-out="new" type="button">${newRec ? `<span class="ai-icon">${SPARK_ICON}</span>` : ''}Create new authorization</button></div></div>`;
  }
  return `${META}${banner()}
    <div class="searched"><div><div class="k">Showing results for ${r.by === 'auth' ? 'tracking number' : 'member information'}</div><div>${esc(r.q)}</div></div><button class="lnk" data-act="back" type="button">${ICON.search}Search again</button></div>
    ${body}`;
}

function doneView() {
  const s = sc(), o = S.outcome;
  const rec = s.decision ? s.recAction : null;
  const verbs = { attach: `Fax attached to #${o.id}`, cont: `Continuation started from #${o.id}`, edit: `Editing request #${o.id}`, new: 'New authorization started', other: o.o };
  const next = { attach: 'The case closes and the fax shows on the request.', cont: 'Next: the request builder, prefilled from the approved request (outside this prototype).', edit: 'Next: the request editor (outside this prototype).', new: 'Next: the request builder with fax fields autofilled (outside this prototype).', other: 'That flow is unchanged by the agent.' };
  let match = '';
  if (rec && rec.action) {
    const hit = o.kind === rec.action && (rec.card ? o.id === rec.card : true);
    match = hit ? `<span class="match yes">Matched the recommendation</span>`
      : `<span class="match no">Different from the recommendation</span>`;
    if (!hit) match += `<p class="note">Logged for eval by comparing the recommendation to <code>ServiceCase.outcome</code> (FR11). The user sees no prompt.</p>`;
  }
  return `<div class="done"><div class="big">${esc(verbs[o.kind])}</div>${match}<p class="note">${next[o.kind]}</p>
    <div><button class="btn sm ghost" data-act="restart" type="button">Restart scenario</button></div></div>`;
}

function reviewView() {
  const s = sc(), d = s.decision, r = REQUESTS.find(x => x.id === d.ref);
  const same = (a, b) => a === b;
  const rows = [
    ['Member ID', FAX.memberId, PATIENT.memberId, same(FAX.memberId, PATIENT.memberId) ? ['ok', 'Match'] : ['warn', 'Differs']],
    ['Service', FAX.svc, r.svc, same(FAX.svc, r.svc) ? ['ok', 'Match'] : ['warn', 'Differs']],
    ['CPT codes', FAX.cpt, r.cpt, same(FAX.cpt, r.cpt) ? ['ok', 'Match'] : ['warn', 'Differs, check before continuing']],
    ['Diagnosis', FAX.dx, r.dx.split(',')[0], ['ok', 'Match']],
    ['Dates', `${FAX.start} to ${FAX.end}`, `${r.start} to ${r.end}`,
      d.value === 'CONTINUATION' ? ['ok', 'Fax starts the day after this request ends'] : ['ok', 'Fax dates fall inside this request']],
  ];
  const primary = d.value === 'CONTINUATION' ? ['cont', 'Start continuation'] : ['attach', 'Attach fax to request'];
  return `${META}${banner()}
    <div class="rv-top"><div class="h-sec">Fax vs request #${r.id}</div><button class="lnk" data-act="back" type="button">Back to search</button></div>
    <div class="cmp" role="table" aria-label="Fax compared with request">
      <div class="r hd" role="row"><span></span><span>This fax</span><span>Request #${r.id} <span class="pill ${r.status === 'Pending' ? 'pend' : 'ok'}">${r.status}</span></span></div>
      ${rows.map(x => `<div class="r" role="row"><span class="lbl">${x[0]}</span><span class="val">${esc(x[1])}</span><span class="val">${esc(x[2])}<span class="st ${x[3][0]}">${x[3][1]}</span></span></div>`).join('')}
    </div>
    <div class="rv-acts"><button class="btn" data-out="${primary[0]}" data-id="${r.id}" type="button">${primary[1]}</button>
      <button class="btn ghost" data-act="details" data-id="${r.id}" type="button">Request details ↗</button>
      <button class="lnk" data-act="toMember" type="button">Not this request</button></div>
    <div class="rv-note">Nothing happens until the user picks an action. The fax stays open on the left the whole time.</div>`;
}

function notesHTML() {
  const s = sc();
  const d = s.decision;
  const payload = d ? JSON.stringify({ outcomeType: d.value, confidenceScore: d.confidence, referenceServiceRequestId: d.ref, referenceAuthNumber: d.refAuth, reasoning: s.why.slice(0, 60) + '...' }, null, 2)
    : '{ "decision": null }';
  const callout = s.callout ? `<div class="callout"><div class="ct">${s.callout.title}</div><div>${s.callout.body}</div><div><strong>Spec gap:</strong> ${s.callout.ask}</div></div>` : '';
  const fut = S.future ? [...(s.notes.future || []), ...(s.decision ? ['A "Not right?" link under the banner opens reason chips (wrong member, wrong request, should be new, should be attach, other) that feed eval.'] : [])] : [];
  const futBlock = fut.length ? `<h3>Future Phase Ideas</h3><ul>${fut.map(x => `<li>${x}</li>`).join('')}</ul>` : '';
  return `<h2>${s.label}</h2>${callout}
    <h3>What the endpoint returns</h3><pre class="payload">${esc(payload)}</pre>
    <h3>What the user sees</h3><ul>${s.notes.sees.map(x => `<li>${x}</li>`).join('')}</ul>
    <h3>Questions this raises</h3><ul>${s.notes.qs.map(x => `<li>${x}</li>`).join('')}</ul>${futBlock}`;
}

function render() {
  document.getElementById('scenarioChips').innerHTML = ORDER.map(k => `<button class="chip" type="button" data-sc="${k}" aria-pressed="${S.scenario === k}">${SCENARIOS[k].label}<small>${SCENARIOS[k].code}</small></button>`).join('');
  document.getElementById('pMvp').setAttribute('aria-pressed', !S.future);
  document.getElementById('pFuture').setAttribute('aria-pressed', S.future);
  const rail = document.getElementById('rail');
  const rf = document.getElementById('railfoot');
  rf.hidden = S.view !== 'results';
  rf.innerHTML = S.view === 'results' ? '<button class="lnk cancel" data-act="back" type="button">Cancel</button><button class="btn" type="button" disabled style="min-width:182px">Continue</button>' : '';
  rail.innerHTML = S.view === 'lookup' ? lookupView() : S.view === 'review' ? reviewView() : S.view === 'results' ? resultsView() : doneView();
  document.getElementById('scenarioNotes').innerHTML = notesHTML();
}

function reviewRequest() { S.view = 'review'; render(); }

function runSearch(forceAuth) {
  const f = S.fields;
  const auth = (forceAuth ?? f.auth).trim();
  if (auth) {
    const m = REQUESTS.find(r => r.id.toLowerCase() === auth.toLowerCase() || r.auth === auth);
    S.results = { by: 'auth', q: auth, notFound: !m, match: m && m.id };
  } else {
    const filled = ['memberId', 'dob', 'last'].filter(k => f[k].trim());
    if (filled.length < 2) { S.err = 'Enter at least 2 of the 3 member fields, or an auth or tracking number.'; render(); return; }
    S.results = { by: 'member', q: [f.memberId, f.dob, f.last].filter(Boolean).join(' · '), notFound: false, match: null };
  }
  S.err = ''; S.view = 'results'; render();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.sc) { S.scenario = t.dataset.sc; reset(); return; }
  if (t.id === 'pMvp' || t.id === 'pFuture') { S.future = t.id === 'pFuture'; S.fbOpen = false; S.fb = null; if (!S.future && S.view === 'review') S.view = 'lookup'; render(); return; }
  if (t.id === 'restart') { reset(); return; }
  if (t.dataset.fb) { S.fb = t.dataset.fb; render(); return; }
  if (t.dataset.out) { S.outcome = { kind: t.dataset.out, id: t.dataset.id }; S.view = 'done'; render(); return; }
  const a = t.dataset.act;
  if (a === 'why') { S.why = !S.why; render(); }
  else if (a === 'fbToggle') { S.fbOpen = !S.fbOpen; render(); }
  else if (a === 'showReq') reviewRequest();
  else if (a === 'search') runSearch();
  else if (a === 'back') { S.view = 'lookup'; render(); }
  else if (a === 'toMember') { S.view = 'lookup'; S.fields.auth = ''; S.ai.auth = false; S.fields.memberId ||= ''; render(); document.getElementById('f-memberId')?.focus(); }
  else if (a === 'restart') reset();
  else if (a === 'other') { S.outcome = { kind: 'other', o: t.dataset.o }; S.view = 'done'; render(); }
  else if (a === 'details') { t.textContent = 'Opens in a new tab (simulated)'; }
});

document.addEventListener('input', e => {
  const wrap = e.target.closest('[data-field]');
  if (!wrap) return;
  const k = wrap.dataset.field;
  S.fields[k] = e.target.value;
  if (S.ai[k]) { S.ai[k] = false; wrap.classList.remove('has-ai'); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('[data-field]')) runSearch();
});

reset();
</script>
</body>
</html>
