:root {
  --font-primary: #212936;
  --font-secondary: #5e6572;
  --font-tertiary: #6f7580;
  --disabled-text: #9e9e9e;
  --divider: #e5e5e5;
  --input-disabled: #f5f6f7;
  --main: #039ec3;
  --primary-dark: #0291b2;
  --faint: #e0f4fc;
  --error: #c62828;
  --warning: #cb7f00;
  --success: #04a15f;
  --page: #f8fbfc;
  --shadow: 0 2px 1px rgba(207, 226, 231, 0.8);
  --gutter: 104px;
  --sans: "Gilroy", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--page);
  color: var(--font-primary);
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 500;
  min-width: 1100px;
}

img { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h2, h3, p { margin: 0; }

/* ---------- Header ---------- */
.primary {
  position: relative;
  height: 74px;
  background: #fff;
  border-bottom: 1px solid var(--divider);
}
.member {
  position: absolute; left: var(--gutter); top: 16px;
  width: 144px; height: 42px; text-align: left;
  font-size: 14px; line-height: 19px;
}
.member .n { font-weight: 600; letter-spacing: 0.25px; color: var(--font-primary); }
.member .d { font-weight: 400; letter-spacing: 0.5px; color: var(--font-secondary); }
.member img { position: absolute; left: 120px; top: 9px; }
.nav-r {
  position: absolute; right: var(--gutter); top: 0; height: 100%;
  display: flex; align-items: center; gap: 32px;
}
.nav-r button { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 400; letter-spacing: 0.5px; color: var(--font-primary); }
.brand {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 24px;
}
.brand .ahp { display: flex; align-items: center; gap: 8px; }

.request {
  position: relative; height: 96px; background: #fff;
  box-shadow: 0 1px 0 0 rgba(118, 118, 118, 0.25);
}
.back {
  position: absolute; left: var(--gutter); top: 36px;
  display: flex; align-items: center; gap: 1px;
  font-weight: 600; font-size: 15px; color: var(--main);
}
.title {
  position: absolute; left: 50%; top: calc(50% - 1px); transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
  font-size: 24px; line-height: 27px; letter-spacing: 0.15px; font-weight: 500;
}

/* ---------- Page + cards ---------- */
.page {
  width: calc(100% - 2 * var(--gutter));
  margin: 32px auto 0;
  padding-bottom: 140px;
  display: flex; flex-direction: column; gap: 40px;
}
.card {
  background: #fff; border-radius: 4px; box-shadow: var(--shadow);
  padding: 24px; display: flex; flex-direction: column; gap: 24px;
}
.hd { display: flex; flex-direction: column; gap: 8px; }
.hd h2 { font-size: 20px; line-height: 22px; font-weight: 600; letter-spacing: 0.15px; }
.note { font-size: 13px; line-height: 15px; font-weight: 400; letter-spacing: 0.15px; color: var(--error); }
h3.sub { font-family: "Figtree", var(--sans); font-size: 16px; line-height: 1.2; font-weight: 600; }
.stack { display: flex; flex-direction: column; gap: 40px; }
.grp { display: flex; flex-direction: column; gap: 16px; }
.block { display: flex; flex-direction: column; gap: 8px; }

/* ---------- Fields ---------- */
.row { display: grid; grid-template-columns: 584fr 160fr 408fr; gap: 16px; align-items: start; }
.row.wiser { grid-template-columns: 584fr 408fr 160fr; }
.row.two { grid-template-columns: 1fr 1fr; }
.cell { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

.fld {
  position: relative; height: 56px; background: #fff;
  border: 1px solid var(--divider); border-radius: 4px; text-align: left;

.fld.dis { background: var(--input-disabled); }
.fld.err { border-color: var(--error); }
.fld.clickable { cursor: pointer; }
.fld:focus-within { border-color: var(--main); }
.fld.err:focus-within { border-color: var(--error); }
.fld input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; outline: 0; background: transparent; border-radius: 4px;
  padding: 0 55px 0 10px; font: 500 15px var(--sans); color: var(--font-primary);
}
.fld input::placeholder { color: var(--font-tertiary); opacity: 1; }
.fld .ph {
  position: absolute; left: 10px; right: 55px; top: 0; bottom: 0;
  display: flex; align-items: center; color: var(--font-tertiary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fld.err .ph.red { color: var(--error); }
.fld .lbl {
  position: absolute; left: 10px; right: 55px; top: 10px;
  font-size: 13px; line-height: 15px; font-weight: 400; letter-spacing: 0.15px;
  color: var(--font-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fld .val {
  position: absolute; left: 10px; right: 55px; top: 28px;
  font-size: 15px; line-height: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fld .r { position: absolute; right: 14px; top: 14px; }
.fld.lg .lbl { font-size: 15px; line-height: 20px; top: 9px; color: var(--font-secondary); letter-spacing: 0; font-weight: 500; }
.fld.lg .val { font-size: 15px; line-height: 20px; top: 29px; }
.cap { font-size: 13px; line-height: 15px; font-weight: 400; letter-spacing: 0.15px; color: var(--error); }

.menu {
  position: absolute; z-index: 30; left: -1px; right: -1px; top: calc(100% + 4px);
  margin: 0; padding: 4px 0; list-style: none; max-height: 260px; overflow: auto;
  background: #fff; border: 1px solid var(--divider); border-radius: 4px;
  box-shadow: 0 4px 12px rgba(33, 41, 54, 0.14);
}
.menu[hidden] { display: none; }
.menu li { padding: 10px 12px; cursor: pointer; font-size: 15px; display: flex; flex-direction: column; gap: 2px; }
.menu li small { font-size: 13px; font-weight: 400; color: var(--font-tertiary); }
.menu li:hover { background: var(--faint); }
.menu li.empty { color: var(--font-tertiary); cursor: default; }
.menu li.empty:hover { background: none; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--faint); color: var(--primary-dark);
  border-radius: 25px; padding: 4px 14px 2px; font-size: 15px; line-height: normal; white-space: nowrap;
}
.chip:hover { filter: brightness(0.96); }

/* ---------- Checkbox / radios / segmented ---------- */
.cb { display: flex; align-items: center; gap: 8px; cursor: pointer; width: fit-content; color: var(--font-secondary); }
.cb .box {
  width: 18px; height: 18px; margin: 3px; border: 2px solid var(--font-secondary); border-radius: 2px;
  display: flex; align-items: center; justify-content: center;
}
.cb .box.on { background: var(--main); border-color: var(--main); }
.radios { display: flex; gap: 24px; align-items: center; }
.radios .rb { display: flex; gap: 8px; }
.radios .rb span { padding-top: 5px; color: var(--disabled-text); }
.care { display: flex; flex-direction: column; gap: 16px; }
.pos-row { display: flex; gap: 16px; align-items: flex-start; }
.pos-row .cell { width: 400px; }

.pos-row .help { width: 512px; font-size: 15px; line-height: 20px; font-weight: 400; color: var(--font-primary); padding-top: 0; }

.seg { display: inline-flex; border: 1px solid var(--divider); border-radius: 4px; overflow: hidden; width: 240px; height: 32px; }
.seg button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 15px; }
.seg button.on { background: var(--faint); }

/* ---------- Warning / exception ---------- */
.warn { display: flex; gap: 8px; align-items: flex-start; color: var(--warning); font-size: 15px; line-height: 18px; font-weight: 500; }
.warn img { margin-top: 1px; flex: none; }
.exc { display: flex; flex-direction: column; gap: 16px; }

/* ---------- Footer ---------- */
.footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: #fff;
  border-top: 1px solid var(--divider);
}
.footer .in { height: 80px; padding: 16px var(--gutter); display: flex; align-items: center; justify-content: space-between; }
.btn-text { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; letter-spacing: 0.25px; color: var(--main); }
.btn-text span, .btn-main span { padding-top: 4px; line-height: 20px; }
.footer .right { display: flex; align-items: center; gap: 32px; }
.footer .err-msg { font-size: 13px; line-height: 15px; font-weight: 400; letter-spacing: 0.15px; color: var(--error); }
.btn-main {
  min-width: 120px; padding: 12px 24px; border-radius: 4px; background: var(--main);
  color: #fff; font-weight: 600; font-size: 16px; letter-spacing: 0.25px; text-align: center;
}
.btn-main:hover { filter: brightness(0.95); }

/* ---------- Authorization check results ---------- */
.ok { display: flex; align-items: center; gap: 8px; color: var(--success); font-weight: 600; font-size: 15px; }

/* ---------- Dev switcher ---------- */

.dev label { display: flex; flex-direction: column; gap: 4px; color: #b1b4b9; }

.presub .detail { display: flex; flex-direction: column; gap: 40px; }
.presub .dx { display: flex; flex-direction: column; gap: 16px; }

.presub .prov,
.presub .svc { display: flex; flex-direction: column; gap: 24px; }
.presub .prov-body { display: flex; flex-direction: column; gap: 40px; }
.presub .rcard .grp { gap: 16px; }

.fld .menu { z-index: 30; }

  function validate() {
    const sc = state.scenario, s = state.e, t = tinned(), E = {};

    const put = (k, p, tin) => { s.e[k] = { p, tin: tin ?? "", addr: "" }; const e = s.e[k]; if (scn === "wiser" || e.tin) e.addr = p.addrs[0]; };
    if (st === "default") return s;
    s.pos = scn === "std" ? { opt: "Other place of service", req: "Office", one: "Inpatient hospital" }[r] : "Office";
    const ord = scn === "wiser" ? P[1] : P[0];
    if (!(scn === "ahp" && st === "blocked")) put("ordering", ord, scn === "wiser" ? "" : "222222222");
    if (st === "pos") return s;
    if (scn === "std") put("acp", DATA.supplier[0], "222222222");
    if (st === "blocked") { s.submitted = true; return s; }
    if (st === "tin") { put("perf", P[0], ""); s.e.perf.addr = ""; s.submitted = true; return s; }
    if (st === "oon" || st === "exception") {
      put("perf", P[0], OON_TIN);
      if (st === "exception") { s.exc = true; s.excChecked = true; s.submitted = true; }
      return s;
    }
    if (scn === "wiser") s.billing = BILLING[0];
    if (scn !== "wiser") put("perf", P[0], "222222222");
    else { s.e.perf = { ...s.e.ordering }; s.same = true; }
    put("facility", DATA.facility[0], scn === "wiser" ? "" : DATA.facility[0].tins[0]);
    if (st === "pa") s.screen = "pa";
    if (st === "review") s.screen = "review";
    if (st === "readonly") s.screen = "readonly";
    return s;
  }
  function applyDev() { state = build(dev.scn, dev.rule, dev.st); render(); }

  /* ---------- screen flow: form -> pa -> review -> readonly -> done ---------- */
  const BACK = { pa: "form", review: "pa", readonly: "pa", done: "readonly" };
  const SNAP_KEYS = ["e", "pos", "billing", "orderKind", "same", "exc", "reason", "comment", "expedite", "extraCode"];
  function go(screen) {
    if (screen === "review" && state.screen !== "review") state.snap = JSON.parse(JSON.stringify(SNAP_KEYS.reduce((o, k) => (o[k] = state[k], o), {})));
    state.screen = screen;
    state.open = null;
    if (screen === "form" || screen === "review") state.submitted = false;
    window.scrollTo(0, 0);
    render();
  }

  /* ---------- render + events ---------- */
  function render() {
    const V = validate();
    errs = state.submitted ? { ...V } : {};
    if (!state.excChecked) delete errs.reason;
    if (!state.cmtChecked) delete errs.comment;
    const hasErr = Object.keys(errs).length > 0;
    const body = state.screen === "pa" ? paPage()
      : state.screen === "review" ? reviewPage()
      : state.screen === "readonly" ? readPage()
      : state.screen === "done" ? donePage()
      : `<main class="page">${careCard()}${orderingCard()}${performingCard()}${state.scenario === "std" ? acpCard() : ""}</main>`;
    app.innerHTML = header() + body + footer(hasErr);
    if (state.focusErr) { state.focusErr = false; const f = app.querySelector(".fld.err, .note, .cap"); if (f) f.scrollIntoView({ block: "center", behavior: "smooth" }); }
    renderDev();
  }

  function onPick(id, v) {
    state.open = null;
    if (id === "pos") { state.pos = v; if (!BILLING_POS.includes(v)) state.billing = ""; }
    else if (id === "billing") state.billing = v;
    else if (id === "reason") { if (v !== state.reason) state.cmtChecked = false; state.reason = v; }
    else {
      const [k, f] = id.split(":");
      const e = state.e[k];
      if (f === "tin") { e.tin = v; e.addr = ""; autoAddr(k); if (k === "perf") checkOON(); }
      else e.addr = v;
      if (k === "ordering" && state.same) copyOrdering();
    }
    render();
  }

  app.addEventListener("click", (ev) => {
    const t = ev.target, wasOpen = state.open;
    if (!t.closest("[data-dd]")) state.open = null;
    const pick = t.closest("[data-pick]");
    if (pick) return onPick(pick.dataset.pick, pick.dataset.v);
    const dd_ = t.closest("[data-dd]");
    if (dd_) { const id = dd_.dataset.dd; state.open = state.open === id ? null : id; return render(); }
    const chip = t.closest("[data-chip]");
    if (chip) { setEntity(chip.dataset.chip, DATA[chip.dataset.kind][+chip.dataset.i]); return render(); }
    const xc = t.closest("[data-xclear]");
    if (xc) {
      const k = xc.dataset.xclear;
      if (isOptional(k)) { clearEntity(k); state.saved = false; render(); }
      return;
    }
    const tg = t.closest("[data-toggle]");
    if (tg) {
      const w = tg.dataset.toggle;
      if (w === "same") { state.same = !state.same; if (state.same) copyOrdering(); else { state.e.perf = blankEnt(); checkOON(); } }
      else if (w === "exc") { state.exc = !state.exc; state.excChecked = false; state.cmtChecked = false; if (!state.exc) { state.reason = ""; state.comment = ""; } }
      else if (w === "expedite") state.expedite = !state.expedite;
      return render();
    }
    const ok = t.closest("[data-orderkind]");
    if (ok) {
      if (state.orderKind !== ok.dataset.orderkind) {
        state.orderKind = ok.dataset.orderkind;
        clearEntity("ordering");
      }
      return render();
    }
    if (t.closest("[data-cont]")) {
      if (state.screen === "pa") { go("readonly"); return; }
      state.submitted = true;
      state.excChecked = state.exc;
      state.cmtChecked = state.exc && state.reason === "Other";
      if (Object.keys(validate()).length === 0) { state.submitted = false; go("pa"); return; }
      state.focusErr = true;
      return render();
    }
    if (t.closest("[data-save]")) {
      state.submitted = true;
      state.excChecked = state.exc;
      state.cmtChecked = state.exc && state.reason === "Other";
      if (Object.keys(validate()).length === 0) { state.snap = null; go("readonly"); return; }
      state.focusErr = true;
      return render();
    }
    if (t.closest("[data-submit]")) { if (state.screen === "readonly") go("done"); return; }
    if (t.closest("[data-edit]")) { go(state.screen === "done" ? "readonly" : "review"); return; }
    if (t.closest("[data-addcode]")) { state.extraCode = true; return render(); }
    if (t.closest("[data-viewinfo]")) return;
    if (t.closest("[data-cancel]")) { if (state.snap) { Object.assign(state, JSON.parse(JSON.stringify(state.snap))); state.snap = null; } state.excChecked = false; state.cmtChecked = false; go("readonly"); return; }
    if (t.closest("[data-delete]")) { if (window.confirm("Delete this draft?")) { const sc = state.scenario; state = blank(sc); go("form"); } return; }
    if (t.closest("[data-back]")) { const prev = BACK[state.screen]; if (prev) go(prev); return; }
    if (wasOpen) render();
  });

  function showMenu(input) {
    const q = input.value.trim().toLowerCase();
    const kind = input.dataset.kind, key = input.dataset.search;
    const cur = state.e[key] && state.e[key].p;
    const list = DATA[kind].map((p, i) => ({ p, i })).filter(({ p }) => !q || `${p.name} ${p.npi} ${p.tins.join(" ")}`.toLowerCase().includes(q));
    const m = input.parentElement.querySelector(".menu");
    m.innerHTML = list.length
      ? list.map(({ p, i }) => `<li data-ent="${key}" data-kind="${kind}" data-i="${i}"${cur && cur.npi === p.npi ? ' class="sel" aria-selected="true"' : ""}>${esc(fmt(p))}<small>TIN ${esc(p.tins.join(", "))}</small></li>`).join("")
      : `<li class="empty">No matches</li>`;
    m.hidden = false;
    input.parentElement.classList.add("open");
  }
  function hideMenu(input) {
    const m = input.parentElement.querySelector(".menu");
    if (m) m.hidden = true;
    input.parentElement.classList.remove("open");
    if (input.dataset.filled) { input.value = ""; input.parentElement.classList.remove("typing"); }
  }
  app.addEventListener("input", (ev) => {
    const i = ev.target;
    if (i.dataset.search) { if (i.dataset.filled) i.parentElement.classList.toggle("typing", i.value !== ""); showMenu(i); }
    else if (i.dataset.model) {
      state[i.dataset.model] = i.value;
      if (i.dataset.model === "comment" && state.submitted) {
        const pos = i.selectionStart;
        render();
        const again = app.querySelector('[data-model="comment"]');
        if (again) { again.focus(); again.setSelectionRange(pos, pos); }
      }
    }
  });
  app.addEventListener("focusin", (ev) => { if (ev.target.dataset && ev.target.dataset.search) showMenu(ev.target); });
  app.addEventListener("focusout", (ev) => {
    if (ev.target.dataset && ev.target.dataset.search) hideMenu(ev.target);
  });
  app.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && ev.target.dataset && ev.target.dataset.search) ev.target.blur();
  });
  app.addEventListener("mousedown", (ev) => {
    if (ev.target.closest("[data-xclear]")) { ev.preventDefault(); return; }
    const li = ev.target.closest("li[data-ent]");
    if (!li) return;
    ev.preventDefault();
    setEntity(li.dataset.ent, DATA[li.dataset.kind][+li.dataset.i]);
    render();
  });

  devEl.addEventListener("click", (ev) => {
    if (ev.target.closest("[data-devtoggle]")) { dev.open = !dev.open; return renderDev(); }
    const scn = ev.target.closest("[data-scn]");
    if (scn) { dev.scn = scn.dataset.scn; if (!devStates().includes(dev.st)) dev.st = "default"; applyDev(); }
  });
  devEl.addEventListener("change", (ev) => {
    if (ev.target.matches("[data-devrule]")) { dev.rule = ev.target.value; applyDev(); }
    if (ev.target.matches("[data-devst]")) { dev.st = ev.target.value; applyDev(); }
  });

  const [hs, hr, hst] = location.hash.slice(1).split("/");
  if (hs && DATA && ["std", "wiser", "ahp"].includes(hs)) {
    dev.scn = hs; dev.rule = hr || "opt"; dev.st = hst || "default";
    state = build(dev.scn, dev.rule, dev.st);
  }
  render();
})();

</script>
</body>
</html>
